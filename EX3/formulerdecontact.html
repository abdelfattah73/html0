<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <h2>Formulaire de contact</h2>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" ><br><br>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="Entrez votre email" ><br><br>
        <label for="sujet">Sujet :</label>
        <input type="text" id="sujet" name="sujet" placeholder="Entrez le sujet" ><br><br>
        <label for="message">Message :</label><br>
        <textarea id="message" name="message" placeholder="Entrez votre message"></textarea><br><br>
        <label for="typededemande">Type de question :</label><br><br>
        <select id="typededemande" name="typededemande">
            <option value="question">Question</option>
            <option value="probleme">Problème</option>
            <option value="autre">Autre</option>
        </select><br><br>
        <button type="submit">Envoyer</button>
        <button type="reset">Réinitialiser</button>
    </form>
</body>
</html>
